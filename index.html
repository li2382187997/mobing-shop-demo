<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>馍饼店 · 田园小摊</title>
  <style>

    canvas { display: block; touch-action: none; }

</head>
<body>
  <canvas id="game"></canvas>
  <script>
const FOODS = [
  {id:'big_bun',name:'大馒头',station:'蒸笼',ingredients:['原味'],price:1,art:'round_bun',shapeCount:3,motions:['tap','tap','tap']},
  {id:'small_bun',name:'小馒头',station:'蒸笼',ingredients:['原味'],price:0.5,art:'square_bun',shapeCount:2,motions:['tap','tap']},
  {id:'twist',name:'花卷',station:'蒸笼',ingredients:['香葱'],price:2,art:'flower_roll',shapeCount:3,motions:['horizontal','horizontal','diagonal']},
  {id:'chive_cake',name:'韭菜饼',station:'平底锅',ingredients:['韭菜'],price:2,art:'filled_pie',shapeCount:3,motions:['horizontal','vertical','horizontal']},
  {id:'shepherd_cake',name:'荠菜饼',station:'平底锅',ingredients:['荠菜'],price:2,art:'filled_pie',shapeCount:3,motions:['horizontal','vertical','horizontal']},
  {id:'beef_cake',name:'牛肉饼',station:'平底锅',ingredients:['牛肉'],price:6,art:'filled_pie',shapeCount:3,motions:['horizontal','vertical','horizontal']},
  {id:'chive_box',name:'韭菜盒子',station:'平底锅',ingredients:['韭菜'],price:4,art:'half_moon',shapeCount:2,motions:['vertical','horizontal']},
  {id:'scallion_cake',name:'葱油饼',station:'平底锅',ingredients:['香葱'],price:8,art:'large_pancake',shapeCount:3,cutCount:3,motions:['horizontal','circle','horizontal']},
  {id:'sesame_cake',name:'芝麻糖饼',station:'烙饼台',ingredients:['芝麻糖'],price:2.5,art:'filled_pie',shapeCount:3,motions:['horizontal','vertical','horizontal']},
  {id:'sauce_cake',name:'酱香饼',station:'烙饼台',ingredients:['香葱','酱香酱'],price:8,art:'sauce_pancake',shapeCount:3,cutCount:3,motions:['horizontal','horizontal','horizontal']},
  {id:'pork_bun',name:'煎包（猪肉馅）',station:'蒸煎锅',ingredients:['猪肉'],price:4,art:'dumpling',shapeCount:3,motions:['vertical','vertical','horizontal']},
  {id:'potstick_mo',name:'锅贴馍',station:'蒸煎锅',ingredients:['香葱'],price:3,art:'potstick',shapeCount:2,motions:['horizontal','horizontal']},
  {id:'egg_pancake',name:'鸡蛋饼',station:'平底锅',ingredients:['鸡蛋','香葱'],price:8,art:'egg_pancake',shapeCount:3,cutCount:3}
];
const STATIONS = ['蒸笼','平底锅','蒸煎锅','烙饼台'];
const INGREDIENTS = ['原味','香葱','韭菜','荠菜','牛肉','猪肉','芝麻糖','酱香酱','鸡蛋'];
const PREP_SEQUENCE={greens:['香葱','韭菜','荠菜'],fillings:['猪肉','牛肉','芝麻糖','酱香酱','鸡蛋']};
const SUPPLY_PRICES={猪肉:2,牛肉:3,芝麻糖:1,酱香酱:2,鸡蛋:1};
const CUSTOMERS = [
  ['周师傅','#A9D7DA','#547C86'],['小禾','#FAD5A9','#E39D87'],['陈奶奶','#CBBBDD','#7D6D99'],
  ['上班族','#A9CBEB','#6387B4'],['学生','#F7CA9E','#DF8D7D'],['菜市场摊主','#BBDAAB','#789A66'],
  ['外卖骑手','#FFE49F','#DA9D58'],['带孩子的家长','#EEBAD1','#AF7390'],['晨练老人','#C1D1C0','#769276'],
  ['路过的游客','#D1C4EE','#8B79B9'],['邻店老板','#E4BFAE','#AB796A'],['放学孩子','#F7C6D9','#B97999'],
  ['夜班护士','#C9E5E0','#6D9E99'],['修鞋师傅','#DABFA7','#956F58'],['摄影爱好者','#C9C0E5','#8177A8'],['社区阿姨','#F3D0B5','#B78065']
].map(([name,color,accent])=>({name,color,accent}));
const byId = Object.fromEntries(FOODS.map(f=>[f.id,f]));
const needsFlip = food => food.station !== '蒸笼' && food.id !== 'egg_pancake';
const COOK_OFFSETS={small_bun:-5,twist:2,chive_cake:-2,shepherd_cake:-1,beef_cake:8,chive_box:1,scallion_cake:-4,sesame_cake:-2,sauce_cake:2,pork_bun:6,potstick_mo:3};
const COOK_CUES={
  big_bun:['大圆面胚在蒸汽里慢慢鼓起','圆馒头蓬松了，可以出笼'],small_bun:['方馒头的棱角正变柔软','两只小方馒头蒸得蓬松了'],
  twist:['花卷的卷层慢慢膨开','葱花藏在褶皱里，香气出来了'],chive_cake:['韭菜馅透出鲜绿','饼皮两面金黄，韭菜香出来了'],
  shepherd_cake:['荠菜碎在薄饼里冒香','荠菜饼的边缘煎黄了'],beef_cake:['厚肉饼的边缘刚开始上色','厚肉饼煎透，外层焦香'],
  chive_box:['半月花边正在定形','盒子的花边酥脆了'],scallion_cake:['薄饼起层，葱香渐浓','葱油饼层层金黄，可以切块'],
  sesame_cake:['芝麻糖馅在饼里慢慢融化','芝麻表面微黄，糖香出来了'],sauce_cake:['大饼表面慢慢起泡','饼已烙好，出锅后记得刷酱'],
  pork_bun:['煎包底部正在煎出金边','面皮蒸软，底部煎出脆壳'],potstick_mo:['长条馍贴锅慢慢定形','锅贴馍底部煎出金黄脆壳'],
  egg_pancake:['蛋液渐渐凝固，葱花飘香','鸡蛋饼熟了，出锅后切块']
};
const FOOD_REACTIONS={
  big_bun:['圆圆的大馒头真松软！','大馒头再蒸松一点会更香。'],small_bun:['小方馒头一口一个！','小方馒头再蒸软一点更好。'],
  twist:['花卷的葱香一层层飘出来！','花卷的褶皱再蒸松一点吧。'],chive_cake:['韭菜饼的馅真鲜！','韭菜饼再煎香一点就好啦。'],
  shepherd_cake:['荠菜清香，饼皮也脆！','荠菜饼的边再烙香一点。'],beef_cake:['牛肉饼厚实又多汁！','牛肉饼的火候再稳一点。'],
  chive_box:['韭菜盒子的花边真漂亮！','盒子的花边再煎脆一点。'],scallion_cake:['葱油饼切得整齐，层层香！','葱油饼再烙出些层次。'],
  sesame_cake:['芝麻糖心甜甜的！','芝麻糖饼再烙香一点。'],sauce_cake:['酱香饼刷得香浓又均匀！','酱香饼的酱味再浓一点。'],
  pork_bun:['煎包底脆，猪肉馅鲜！','煎包的底再煎脆一点。'],potstick_mo:['锅贴馍底脆上面软！','锅贴馍的底再煎黄一点。'],
  egg_pancake:['鸡蛋抹得匀，香葱真香！','鸡蛋饼再煎得均匀一点。']
};

class Game {
  constructor(saved={},random=Math.random) {
    this.random=random;
    this.day=Number.isFinite(saved.day)?Math.max(1,saved.day):1;
    this.coins=Number.isFinite(saved.coins)?Math.max(0,saved.coins):120;
    this.upgrades=saved.upgrades&&typeof saved.upgrades==='object'?{...saved.upgrades}:{};
    this.totalSales=Object.fromEntries(FOODS.map(f=>[f.id,Math.max(0,Number(saved.totalSales?.[f.id])||0)]));
    this.customerVisits=Object.fromEntries(CUSTOMERS.map(c=>[c.name,Math.max(0,Number(saved.customerVisits?.[c.name])||0)]));
    this.customerFavorites=Object.fromEntries(Object.entries(saved.customerFavorites||{}).filter(([name,id])=>CUSTOMERS.some(c=>c.name===name)&&!!byId[id]));
    this.reputation=Math.max(0,Number(saved.reputation)||0);
    this.phase='welcome'; this.orders=[]; this.selectedId=null; this.nextId=1;
    this.stock={dough:0,greens:0,fillings:0,...saved.pantry?.stock};this.prepared={...saved.pantry?.prepared};this.prepChoice={greens:0,fillings:0};
    this.prepWork={dough:0,greens:0,...saved.pantry?.prepWork};this.gardenCrop=saved.pantry?.gardenCrop||null;this.purchased={...saved.pantry?.purchased};
    this.supplySystemEnabled=!!saved.pantry?.enabled;
    this.farm=saved.pantry?.farm?JSON.parse(JSON.stringify(saved.pantry.farm)):null;
    this.visitors=0; this.targetVisitors=9+Math.floor(this.random()*4);
    this.revenue=0; this.costs=0; this.sales=Object.fromEntries(FOODS.map(f=>[f.id,0]));
    this.tips=0;this.qualityTotal=0;this.perfects=0;this.repeatCustomers=0;
    this.message='今天也做香香的馍饼吧！'; this.lastReaction='';
    this.restoreSession(saved.session);
    this.mergeScallions();
    if(saved.pantry?.prepared||saved.session?.prepared)this.syncGreensStock();
  }
  mergeScallions(){
    const merge=values=>{if(!values)return;for(const old of ['大葱花','大葱']){if(values[old])values['香葱']=(Number(values['香葱'])||0)+(Number(values[old])||0);delete values[old];}};
    const rename=name=>['大葱花','大葱'].includes(name)?'香葱':name;
    merge(this.prepared);this.gardenCrop=rename(this.gardenCrop);
    const f=this.farm;if(!f)return;
    merge(f.whole);
    for(const key of ['seed','chopCrop','chopChoice'])f[key]=rename(f[key]);
    for(const tile of f.vegetables||[])tile.crop=rename(tile.crop);
    if(f.cutProgress){for(const old of ['大葱花','大葱']){if(f.cutProgress[old])f.cutProgress['香葱']=Math.max(f.cutProgress['香葱']||0,f.cutProgress[old]);delete f.cutProgress[old];}}
  }
  syncGreensStock(){
    this.stock.greens=PREP_SEQUENCE.greens.reduce((sum,name)=>sum+Math.max(0,Number(this.prepared[name])||0),0);
    return this.stock.greens;
  }
  restoreSession(session){
    if(!session||!['prep','business','close'].includes(session.phase))return false;
    this.phase=session.phase;this.stock={dough:0,greens:0,fillings:0,...session.stock};
    this.prepWork={dough:0,greens:0,...session.prepWork};this.gardenCrop=session.gardenCrop||null;this.purchased={...session.purchased};
    this.supplySystemEnabled=!!session.supplySystemEnabled;
    this.prepChoice={greens:0,fillings:0};
    for(const kind of ['greens','fillings']){const choice=Number(session.prepChoice?.[kind]);if(Number.isInteger(choice)&&choice>=0)this.prepChoice[kind]=choice%PREP_SEQUENCE[kind].length;}
    this.prepared=session.prepared&&typeof session.prepared==='object'?{...session.prepared}:{};
    if(!session.prepared)for(const kind of ['greens','fillings'])for(const name of PREP_SEQUENCE[kind].slice(0,Math.max(0,Math.min(PREP_SEQUENCE[kind].length,this.stock[kind]||0))))this.prepared[name]=(this.prepared[name]||0)+1;
    this.visitors=Math.max(0,Number(session.visitors)||0);this.targetVisitors=Math.max(this.visitors,Number(session.targetVisitors)||this.targetVisitors);
    this.revenue=Math.max(0,Number(session.revenue)||0);this.costs=Math.max(0,Number(session.costs)||0);this.tips=Math.max(0,Number(session.tips)||0);this.qualityTotal=Math.max(0,Number(session.qualityTotal)||0);this.perfects=Math.max(0,Number(session.perfects)||0);this.repeatCustomers=Math.max(0,Number(session.repeatCustomers)||0);
    this.sales=Object.fromEntries(FOODS.map(f=>[f.id,Math.max(0,Number(session.sales?.[f.id])||0)]));
    this.orders=(Array.isArray(session.orders)?session.orders:[]).map(raw=>{
      const food=byId[raw.foodId],customer=CUSTOMERS.find(c=>c.name===raw.customerName);if(!food||!customer)return null;
      const copy={...raw,food,customer};if(typeof copy.familiarOrder!=='boolean')copy.familiarOrder=(this.customerFavorites[customer.name]===food.id);delete copy.foodId;delete copy.customerName;return copy;
    }).filter(Boolean);
    this.syncGreensStock();
    this.nextId=Math.max(Number(session.nextId)||1,...this.orders.map(o=>o.id+1));
    this.selectedId=this.orders.some(o=>o.id===session.selectedId)?session.selectedId:this.orders[0]?.id||null;return true;
  }
  pick(a){return a[Math.min(a.length-1,Math.floor(this.random()*a.length))];}
  beginPrep(){if(this.phase!=='welcome')return false;this.phase='prep';this.supplySystemEnabled=true;return true;}
  prepSelected(kind){const choices=PREP_SEQUENCE[kind];return choices?.[this.prepChoice[kind]||0]||null;}
  cyclePrep(kind,direction=1){const choices=PREP_SEQUENCE[kind];if(!['prep','business','close'].includes(this.phase)||!choices||!Number.isFinite(direction)||kind==='greens'&&this.prepWork.greens>0)return false;this.prepChoice[kind]=((this.prepChoice[kind]||0)+Math.sign(direction)+choices.length)%choices.length;return true;}
  prepare(kind){
    const limits={dough:6,greens:5,fillings:5},steps={dough:2,greens:1,fillings:1};
    if(!['prep','business','close'].includes(this.phase)||!limits[kind]||this.stock[kind]>=limits[kind])return false;
    if(PREP_SEQUENCE[kind]){const name=kind==='greens'&&this.gardenCrop||this.prepSelected(kind);this.prepared[name]=(this.prepared[name]||0)+1;}
    this.stock[kind]=Math.min(limits[kind],this.stock[kind]+steps[kind]);return true;
  }
  advancePrep(kind){
    if(!['prep','business','close'].includes(this.phase)||!['dough','greens'].includes(kind)||this.stock[kind]>=(kind==='dough'?6:5))return false;
    if(kind==='greens'&&this.prepWork.greens===0)this.gardenCrop=this.prepSelected('greens');
    if(this.prepWork[kind]<3){this.prepWork[kind]++;return true;}
    if(!this.prepare(kind))return false;
    this.prepWork[kind]=0;if(kind==='greens')this.gardenCrop=null;return true;
  }
  buySupply(name){
    const price=SUPPLY_PRICES[name];
    if(!['prep','business','close'].includes(this.phase)||!price||this.coins<price)return false;
    this.coins-=price;this.costs+=price;this.stock.fillings++;this.prepared[name]=(this.prepared[name]||0)+1;this.purchased[name]=(this.purchased[name]||0)+1;return true;
  }
  prepReady(){return this.stock.dough>=2&&this.stock.greens>=1&&this.stock.fillings>=1;}
  buySeed(name){
    if(!['prep','business','close'].includes(this.phase)||!PREP_SEQUENCE.greens.includes(name)||this.coins<.5)return false;
    this.coins-=.5;this.costs+=.5;return true;
  }
  prepFull(){return this.stock.dough>=6&&this.stock.greens>=5&&this.stock.fillings>=5;}
  openShop(){
    if(this.phase!=='prep'||!this.prepReady())return false;
    this.phase='business';while(this.orders.length<3&&this.orders.length<this.targetVisitors)this.addOrder();
    this.selectedId=this.orders[0].id;return true;
  }
  startDay(){
    if(this.phase!=='welcome')return false;
    this.phase='business';
    while(this.orders.length<3&&this.orders.length<this.targetVisitors)this.addOrder();
    this.selectedId=this.orders[0].id; return true;
  }
  addOrder(){
    const used=this.orders.map(o=>o.customer.name);
    const pool=CUSTOMERS.filter(c=>!used.includes(c.name));
    const customer=this.pick(pool.length?pool:CUSTOMERS),usedFoods=this.orders.map(o=>o.food.id),foodPool=FOODS.filter(f=>!usedFoods.includes(f.id));
    const favorite=byId[this.customerFavorites[customer.name]],available=foodPool.length?foodPool:FOODS;
    const food=favorite&&available.includes(favorite)&&this.random()<.65?favorite:this.pick(available);
    const preference=food.station==='蒸笼'?'soft':this.pick(['soft','normal','crispy']);
    const slot=[0,1,2].find(s=>!this.orders.some(o=>o.slot===s));
    this.orders.push({id:this.nextId++,slot,customer,food,preference,state:'waiting',kneads:0,ingredientIndex:0,
      shapes:0,cook:0,heat:'medium',flipped:false,flipAt:0,cuts:0,quality:0,patience:100,familiarOrder:(this.customerVisits[customer.name]||0)>0&&this.customerFavorites[customer.name]===food.id});
  }
  get selected(){return this.orders.find(o=>o.id===this.selectedId)||null;}
  orderAt(slot){return this.orders.find(o=>o.slot===slot)||null;}
  select(id){if(!this.orders.some(o=>o.id===id))return false;this.selectedId=id;return true;}
  request(o){
    const wish=o.preference==='crispy'?'焦香一点':o.preference==='soft'?'软乎一点':'平常火候';
    return `${o.food.name}，${wish}`;
  }
  instruction(o=this.selected){
    if(!o)return '点一位客人开始';
    if(o.food.id==='egg_pancake'){
      const hints={waiting:'把面糊拖进这口锅',batter_spread:'在锅里划动，摊开面糊',egg_add:'把鸡蛋拖到饼面上',egg_spread:'划动饼面，把鸡蛋抹匀',scallion_add:'撒上香葱'};
      if(hints[o.state])return hints[o.state];
    }
    if(o.food.id==='sauce_cake'&&o.state==='sauce')return '把酱香酱拖来，用刷子均匀刷开';
    if(o.food.id==='sauce_cake'&&o.state==='sauce_spread')return `在饼面来回刷酱 ${Math.floor(o.sauceSpreads||0)}/3`;
    if(o.state==='waiting')return '把面团拖到这块案板';
    if(o.state==='knead')return `左右揉面 ${o.kneads}/3`;
    if(o.state==='ingredient'){const total=o.food.id==='sauce_cake'?1:o.food.ingredients.length;return `加入${o.food.ingredients[o.ingredientIndex]} ${o.ingredientIndex}/${total}`;}
    if(o.state==='shape'){
      const words={round_bun:'团成大圆馒头',square_bun:'压边做成方馒头',flower_roll:'卷起再扭出花卷褶皱',
        filled_pie:'擀圆后收口',half_moon:'两边合成半月形',large_pancake:'擀成一张大圆饼',
        sauce_pancake:'摊成一张大圆饼',dumpling:'捏出饺子形褶边',potstick:'捏成长条锅贴',egg_pancake:'把鸡蛋在大饼上抹匀'};
      if(o.food.art==='flower_roll')return `${['把葱花面片擀成长条','从一端卷成面卷','交叉扭出花卷褶皱'][o.shapes]||'扭成花卷'} ${o.shapes}/${o.food.shapeCount}`;
      if(o.food.art==='round_bun')return `${['收拢面片边缘','双手团成圆胚','轻压表面，留出蒸发空间'][o.shapes]} ${o.shapes}/${o.food.shapeCount}`;
      if(o.food.art==='square_bun')return `${['把面片压成长方形','分成两只方方的小馒头'][o.shapes]} ${o.shapes}/${o.food.shapeCount}`;
      const steps={chive_cake:['把韭菜碎铺在面片中间','向中心捏紧收口','轻轻压成圆饼'],shepherd_cake:['铺上切细的荠菜','包住荠菜馅并收口','压成薄圆饼'],beef_cake:['放上牛肉馅','沿边捏严实防漏汁','压成厚实肉饼'],chive_box:['把韭菜馅铺在半边','折起面皮并压出半月花边'],scallion_cake:['撒香葱卷起面片','盘成圆形面团','擀成一张大圆饼'],sesame_cake:['把芝麻糖馅放在中间','收口包住糖馅','压成圆饼并撒芝麻'],sauce_cake:['擀薄面片','铺平压圆','摊成一张大饼'],pork_bun:['放入猪肉馅','对折捏出饺子形','沿边捏出密密的褶'],potstick_mo:['拉成长条面片','撒葱后卷成长条锅贴']};
      if(steps[o.food.id])return `${steps[o.food.id][o.shapes]} ${o.shapes}/${o.food.shapeCount}`;
      return `${words[o.food.art]} ${o.shapes}/${o.food.shapeCount}`;
    }
    if(o.state==='station')return `把它拖进${o.food.station}`;
    if(o.state==='cooking'){
      const cues=COOK_CUES[o.food.id]||['慢慢加热','火候到了，可以出锅'];
      if(needsFlip(o.food)&&!o.flipped&&o.cook>=30)return `上划翻面 · ${cues[0]}`;
      return o.cook>=this.cookTarget(o)-8?cues[1]:cues[0];
    }
    if(o.state==='cut')return `${['横着切第一刀','斜着切第二刀','反方向切第三刀'][o.cuts]||'把大饼切块'} ${o.cuts}/${o.food.cutCount}`;
    return '拖给对应客人，或点交付';
  }
  useStock(kind,name){
    if(!this.stock)return false;

  <script>

  <script>
    const storage = {
      get() { return JSON.parse(localStorage.getItem('mobing-save-v3') || '{}'); },
      set(value) { localStorage.setItem('mobing-save-v3', JSON.stringify(value)); }
    };
    const ui = new window.MoBingUI(document.getElementById('game'), storage);
    if (new URLSearchParams(location.search).has('food-art')) ui.overlay = 'book';
    if (new URLSearchParams(location.search).has('garden')) ui.overlay = 'yard';
    window.addEventListener('resize', () => ui.resize());
    ui.canvas.addEventListener('pointerdown', e => { ui.canvas.setPointerCapture(e.pointerId); ui.start(e.clientX, e.clientY); });
    ui.canvas.addEventListener('pointermove', e => ui.move(e.clientX, e.clientY));
    ui.canvas.addEventListener('pointerup', e => ui.end(e.clientX, e.clientY));
    ui.canvas.addEventListener('pointercancel', () => { ui.pointer = null;ui.save(); });
    window.addEventListener('pagehide', () => ui.save());
    document.addEventListener('visibilitychange', () => { ui.paused=document.hidden;if(document.hidden)ui.save();else ui.last=Date.now(); });
    window.addEventListener('keydown', e => {
      if (e.key === 'Enter' && ui.game.phase === 'welcome' && !ui.overlay) ui.game.beginPrep();
      if (e.key === 'Escape') ui.overlay = null;
    });
    function loop() { ui.frame(); requestAnimationFrame(loop); }
    loop();
  </script>
